[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-barcode-tunnel"
version = "0.1.0"
description = "Учебный прототип агрегатора шестистороннего тоннеля чтения штрихкодов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Кандидат" }]
dependencies = []

[project.optional-dependencies]
vision = ["Pillow>=10,<13", "zxing-cpp>=2.2,<3"]

[project.scripts]
barcode-tunnel = "barcode_tunnel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

